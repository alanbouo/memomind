server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Gzip compression
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript image/svg+xml;

    include /etc/nginx/snippets/security-headers.conf;

    # index.html and the per-route HTML files must never be cached: they point at
    # the content-hashed bundle, so a cached copy keeps serving the previous
    # build's JS long after a redeploy.
    location = / {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "no-cache, must-revalidate" always;
        try_files /index.html =404;
    }

    # Pages with their own prerendered HTML (see scripts/prerender-head.mjs)
    location ~ "^/(login|privacy)/?$" {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "no-cache, must-revalidate" always;
        try_files $uri/index.html /index.html =404;
    }

    # Cache static assets - safe because Vite fingerprints their filenames
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        include /etc/nginx/snippets/security-headers.conf;
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # Real files only (robots.txt, sitemap.xml, config.js...). Any other path is a
    # true 404: error_page serves the SPA shell with the 404 status kept, so the
    # client renders its "not found" page.
    location / {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "no-cache, must-revalidate" always;
        try_files $uri =404;
    }

    error_page 404 /index.html;
}
